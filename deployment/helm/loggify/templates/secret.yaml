{{- if not .Values.gateway.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "loggify.name" . }}-gateway
  labels:
    {{- include "loggify.labels" . | nindent 4 }}
type: Opaque
stringData:
  keys: {{ required "gateway.ingestKeys is required when existingSecret is empty" .Values.gateway.ingestKeys | quote }}
{{- end }}

