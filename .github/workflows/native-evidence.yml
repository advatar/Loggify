name: Native gateway evidence
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gateway-evidence:
    # This dedicated self-hosted runner is part of the disclosed trust boundary.
    runs-on: [self-hosted, macOS, ARM64, loggify]
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test and package the actual gateway
        run: python3 scripts/evidence/capture.py evidence-output
      - name: Authenticate the package, native test output and build record
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: evidence-output/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: loggify-native-evidence
          path: evidence-output/
          if-no-files-found: error
          retention-days: 90
