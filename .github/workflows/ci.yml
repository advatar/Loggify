name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: [self-hosted, macOS, ARM64, loggify]
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm test
      - run: docker compose config --quiet
      - run: docker build -f gateway/Dockerfile .

  dart:
    runs-on: [self-hosted, macOS, ARM64, loggify]
    defaults:
      run:
        working-directory: sdk/dart
    steps:
      - uses: actions/checkout@v4
      - run: /Users/johansellstrom/fvm/versions/stable/bin/dart pub get
      - run: /Users/johansellstrom/fvm/versions/stable/bin/dart format --output=none --set-exit-if-changed lib test
      - run: /Users/johansellstrom/fvm/versions/stable/bin/dart analyze --fatal-infos
      - run: /Users/johansellstrom/fvm/versions/stable/bin/dart test

  swift:
    runs-on: [self-hosted, macOS, ARM64, loggify]
    defaults:
      run:
        working-directory: sdk/swift
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  helm:
    runs-on: [self-hosted, macOS, ARM64, loggify]
    steps:
      - uses: actions/checkout@v4
      - run: helm lint deployment/helm/loggify
      - run: helm template loggify deployment/helm/loggify >/dev/null
